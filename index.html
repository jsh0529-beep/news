<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>속보 상황판 — 대한민국 실시간 지역 뉴스</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&family=IBM+Plex+Sans+KR:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#050B1A; --ink-2:#0A1428; --ink-3:#122140;
  --print:#EDF1F8; --print-dim:#8798B4;
  --hoeoe:#FF3B2F; --amber:#FFB43A; --teal:#5FE0D0;
  --rule:rgba(237,241,248,.14);
  --tilt:28deg; --dim:.20;
  --display:'Nanum Myeongjo',serif;
  --body:'IBM Plex Sans KR','Apple SD Gothic Neo',sans-serif;
  --mono:'IBM Plex Mono',monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ink);color:var(--print);font-family:var(--body);font-weight:300;
  -webkit-font-smoothing:antialiased;overflow:hidden}

header{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap;padding:13px 20px 11px;
  border-bottom:1px solid var(--rule);background:linear-gradient(180deg,#0D1B36,var(--ink))}
.masthead{font-family:var(--display);font-weight:800;font-size:23px;letter-spacing:-.02em;line-height:1}
.masthead em{font-style:normal;color:var(--hoeoe)}
.sub{font-family:var(--mono);font-size:10px;letter-spacing:.22em;color:var(--print-dim);text-transform:uppercase;margin-top:4px}
.live{display:inline-flex;align-items:center;gap:7px;font-family:var(--mono);font-size:11px;
  letter-spacing:.16em;padding:4px 9px;border:1px solid var(--hoeoe);color:var(--hoeoe)}
.live[data-mode="sample"]{border-color:var(--amber);color:var(--amber)}
.live[data-mode="loading"]{border-color:var(--print-dim);color:var(--print-dim)}
.pip{width:6px;height:6px;border-radius:50%;background:currentColor;animation:pip 1.5s infinite}
@keyframes pip{0%,100%{opacity:1}50%{opacity:.12}}
.spacer{flex:1}
.stat{font-family:var(--mono);font-size:11px;color:var(--print-dim)}
.stat b{color:var(--print);font-weight:500;font-size:13px}
.btn{font-family:var(--mono);font-size:11px;letter-spacing:.1em;color:var(--print);background:transparent;
  border:1px solid var(--rule);padding:6px 12px;cursor:pointer;transition:border-color .2s,color .2s}
.btn:hover{border-color:var(--amber);color:var(--amber)}
.btn:focus-visible,.card:focus-visible,select:focus-visible,.hit:focus-visible{outline:2px solid var(--amber);outline-offset:3px}

main{display:grid;grid-template-columns:1fr 380px;height:calc(100% - 106px)}

/* ── 무대 ─────────────────────────────── */
.stage{position:relative;overflow:hidden;background:var(--ink)}
.ambient{position:absolute;inset:0;pointer-events:none;background:
  radial-gradient(95% 80% at 46% 40%,#0E2246 0%,#081226 55%,#050B1A 100%)}
.stage::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:8;
  background:
    repeating-linear-gradient(180deg,rgba(0,0,0,.16) 0 1px,transparent 1px 3px),
    radial-gradient(120% 95% at 50% 46%,transparent 55%,rgba(2,6,16,.82) 100%)}

.scene{position:absolute;inset:0;perspective:1500px;perspective-origin:47% 34%;
  display:flex;align-items:center;justify-content:center}
.plane{
  position:relative;width:828px;height:676px;transform-style:preserve-3d;
  transform:rotateX(var(--tilt)) scale(calc(var(--fit,.7) * var(--zoom,1)));
  transform-origin:var(--ox,50%) var(--oy,50%);
  transition:transform .9s cubic-bezier(.19,1,.22,1);
}
.plane>.mapsvg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;
  opacity:min(1, calc(.85 + var(--dim)))}

.node{position:absolute;width:0;height:0;transform-style:preserve-3d;--c:#8798B4}
.pool{position:absolute;left:0;top:0;width:74px;height:74px;margin:-37px 0 0 -37px;border-radius:50%;
  background:radial-gradient(closest-side,var(--c),transparent 74%);opacity:0;transition:opacity .5s}
.node.hot .pool{opacity:.5}
.ring{position:absolute;left:0;top:0;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;
  border:1px solid var(--c);opacity:0}
.node.hot .ring{animation:ripple 3s ease-out infinite}
@keyframes ripple{0%{transform:scale(.4);opacity:.9}100%{transform:scale(6.5);opacity:0}}
.dot{position:absolute;left:0;top:0;width:7px;height:7px;margin:-3.5px 0 0 -3.5px;border-radius:50%;
  background:radial-gradient(circle,#fff 0%,var(--c) 45%,transparent 72%);opacity:.7;transition:opacity .3s}
.node.hot .dot{opacity:1;width:13px;height:13px;margin:-6.5px 0 0 -6.5px}
.beam{position:absolute;left:-1.5px;bottom:0;width:3px;height:0;transform-origin:50% 100%;
  transform:rotateX(-90deg);border-radius:2px;
  background:linear-gradient(180deg,transparent,var(--c) 52%,#fff 100%);
  transition:height .8s cubic-bezier(.19,1,.22,1)}
.beam::before{content:"";position:absolute;left:-6px;right:-6px;top:0;bottom:0;border-radius:6px;
  background:linear-gradient(90deg,transparent,var(--c),transparent);opacity:.4}
.beam::after{content:"";position:absolute;left:-14px;right:-14px;top:-4px;bottom:-2px;border-radius:14px;
  background:radial-gradient(50% 60% at 50% 70%,var(--c),transparent 70%);opacity:.28}
.chip{position:absolute;left:50%;top:-3px;transform:translate(-50%,-100%) rotateX(calc(90deg - var(--tilt)));
  transform-origin:50% 100%;white-space:nowrap;text-align:center;opacity:.5;transition:opacity .4s}
.node.hot .chip{opacity:1}
.chip{background:rgba(4,9,20,.62);padding:2px 9px 3px;border-radius:2px}
.chip .rg{font-family:var(--display);font-weight:800;font-size:19px;color:#fff;letter-spacing:.02em}
.chip .ct{font-family:var(--mono);font-size:13px;color:var(--c);letter-spacing:.1em;margin-left:6px}
.node.dim{opacity:.18}
.node.base .dot{width:5px;height:5px;margin:-2.5px 0 0 -2.5px;opacity:.45}
.node.base .chip{opacity:.34}
.node.base .chip .rg{font-size:14px;font-weight:700}
.node.sel .beam::before{opacity:.8}
.node.sel .beam::after{opacity:.55}
.hit{position:absolute;left:-24px;top:-24px;width:48px;height:48px;border:0;background:none;
  padding:0;cursor:pointer;border-radius:50%}

/* 판 위 오버레이 */
.grid{position:absolute;inset:0;pointer-events:none;opacity:.16;
  background:
    linear-gradient(90deg,rgba(120,180,255,.5) 1px,transparent 1px),
    linear-gradient(180deg,rgba(120,180,255,.5) 1px,transparent 1px);
  background-size:64px 64px}
.scan{position:absolute;left:0;right:0;top:-14%;height:14%;pointer-events:none;
  background:linear-gradient(180deg,transparent,rgba(120,200,255,.10) 78%,rgba(160,220,255,.35));
  animation:scan 7s linear infinite}
@keyframes scan{to{top:114%}}
.capture{position:absolute;inset:0;z-index:1}
.cross{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .25s;z-index:2}
.stage:hover .cross{opacity:1}
.cross .cx,.cross .cy{position:absolute;background:rgba(160,210,255,.28)}
.cross .cx{top:0;bottom:0;width:1px}
.cross .cy{left:0;right:0;height:1px}
.cross b{position:absolute;transform:translate(12px,-22px);font-family:var(--mono);font-weight:400;
  font-size:11px;letter-spacing:.08em;color:#9CC8FF;background:rgba(4,9,20,.6);
  padding:1px 6px;border-radius:2px;white-space:nowrap}
.reticle{position:absolute;width:76px;height:76px;margin:-38px 0 0 -38px;pointer-events:none;
  opacity:0;transform:scale(2.2);transition:opacity .35s,transform .5s cubic-bezier(.19,1,.22,1);z-index:4}
.reticle.on{opacity:1;transform:scale(1)}
.reticle i{position:absolute;width:20px;height:20px;border:1.5px solid #CFE4FF}
.reticle i:nth-child(1){left:0;top:0;border-right:0;border-bottom:0}
.reticle i:nth-child(2){right:0;top:0;border-left:0;border-bottom:0}
.reticle i:nth-child(3){left:0;bottom:0;border-right:0;border-top:0}
.reticle i:nth-child(4){right:0;bottom:0;border-left:0;border-top:0}
.reticle b{position:absolute;left:50%;top:100%;transform:translateX(-50%);margin-top:7px;
  font-family:var(--mono);font-weight:500;font-size:10.5px;letter-spacing:.22em;color:#9CC8FF;
  background:rgba(4,9,20,.6);padding:1px 6px;border-radius:2px;white-space:nowrap}
/* 무대 모서리·상시 계기 */
.hud{position:absolute;inset:0;pointer-events:none;z-index:9}
.hud .c{position:absolute;width:20px;height:20px;border:1.5px solid rgba(160,210,255,.55)}
.hud .tl{left:12px;top:12px;border-right:0;border-bottom:0}
.hud .tr{right:12px;top:12px;border-left:0;border-bottom:0}
.hud .bl{left:12px;bottom:12px;border-right:0;border-top:0}
.hud .br{right:12px;bottom:12px;border-left:0;border-top:0}
.hud-tl{position:absolute;left:26px;top:22px;font-family:var(--mono);font-size:10.5px;
  line-height:1.9;letter-spacing:.18em;color:rgba(156,200,255,.85);text-shadow:0 0 12px rgba(0,0,0,.8)}
.hud-tl .dim2{color:rgba(135,152,180,.75)}
.hud-tr{position:absolute;right:26px;top:22px;text-align:right;font-family:var(--mono);font-size:10.5px;
  line-height:1.9;letter-spacing:.18em;color:rgba(156,200,255,.85)}
.controls{position:absolute;left:20px;bottom:16px;display:flex;gap:16px;align-items:center;z-index:9;
  font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--print-dim)}
.controls input[type=range]{width:96px;accent-color:var(--amber);vertical-align:middle}
.legend{position:absolute;right:20px;bottom:16px;display:flex;gap:14px;z-index:9;
  font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--print-dim)}
.legend i{display:inline-block;width:8px;height:8px;margin-right:5px;border-radius:50%}
.reset{position:absolute;left:50%;top:16px;transform:translateX(-50%);z-index:9;opacity:0;
  pointer-events:none;transition:opacity .3s}
.reset.on{opacity:1;pointer-events:auto}

/* ── 피드 ─────────────────────────────── */
.feed{border-left:1px solid var(--rule);display:flex;flex-direction:column;background:var(--ink-2);min-width:0}
.feedhead{padding:11px 16px;border-bottom:1px solid var(--rule);display:flex;align-items:center;gap:10px}
.feedhead h2{font-family:var(--display);font-weight:700;font-size:15px;margin:0}
.feedhead select{margin-left:auto;background:var(--ink-3);color:var(--print);border:1px solid var(--rule);
  font-family:var(--mono);font-size:11px;padding:4px 6px}
.list{flex:1;overflow-y:auto;overscroll-behavior:contain}
.list::-webkit-scrollbar{width:6px}
.list::-webkit-scrollbar-thumb{background:var(--ink-3)}
.card{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--rule);
  padding:13px 16px 14px;cursor:pointer;color:inherit;font:inherit;border-left:2px solid transparent;
  text-decoration:none;transition:background .18s,border-left-color .18s}
.card:hover{background:var(--ink-3)}
.card.sel{background:var(--ink-3);border-left-color:var(--c)}
.meta{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.badge{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;padding:2px 6px;color:#050B1A;background:var(--c);font-weight:500}
.badge.brk{background:var(--hoeoe);color:#fff;animation:brkblink 1.4s step-end infinite}
@keyframes brkblink{0%,100%{opacity:1}50%{opacity:.55}}
.card.isbrk .hl{color:#fff}
.card.fresh{animation:freshin 1.6s ease-out 1}
@keyframes freshin{0%{background:rgba(160,210,255,.16);border-left-color:#9CC8FF}100%{background:transparent}}
.rgname{font-family:var(--display);font-weight:700;font-size:12px}
.time{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--print-dim)}
.hl{font-family:var(--display);font-weight:700;font-size:15.5px;line-height:1.42;margin:0 0 5px;letter-spacing:-.015em}
.sm{font-size:12.5px;line-height:1.55;color:var(--print-dim);margin:0}
.foot{display:flex;align-items:center;gap:10px;margin-top:8px}
.src{font-family:var(--mono);font-size:9.5px;color:rgba(135,152,180,.7);letter-spacing:.08em}
.pin{margin-left:auto;font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;color:var(--print-dim);
  cursor:pointer;border-bottom:1px solid var(--rule);padding-bottom:1px}
.pin:hover{color:var(--amber);border-color:var(--amber)}
.sechead{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:8px;
  padding:8px 16px;background:linear-gradient(180deg,var(--ink-2) 78%,rgba(10,20,40,0));
  font-family:var(--mono);font-size:10.5px;letter-spacing:.22em;color:var(--print-dim)}
.sechead b{color:var(--print);font-weight:500}
.sechead.brkhead{color:var(--hoeoe)}
.sechead.brkhead b{color:var(--hoeoe)}
.sechead::after{content:"";flex:1;height:1px;background:var(--rule)}
.secempty{padding:14px 16px 16px;font-size:12px;color:var(--print-dim);border-bottom:1px solid var(--rule)}
.empty{padding:40px 20px;text-align:center;color:var(--print-dim);font-size:13px;line-height:1.7}
.empty b{display:block;font-family:var(--display);font-size:15px;color:var(--print);margin-bottom:8px;font-weight:700}

.ticker{height:38px;border-top:1px solid var(--rule);background:var(--ink-2);display:flex;align-items:center;overflow:hidden}
.tkr-label{flex:none;padding:0 14px;height:100%;display:flex;align-items:center;background:var(--hoeoe);
  color:#050B1A;font-family:var(--mono);font-size:10.5px;letter-spacing:.2em;font-weight:500;z-index:2}
.tkr-track{display:flex;gap:44px;white-space:nowrap;animation:roll 55s linear infinite;padding-left:24px}
.tkr-track span{font-size:12.5px;color:var(--print-dim)}
.tkr-track span b{color:var(--print);font-family:var(--display);font-weight:700;margin-right:7px}
@keyframes roll{from{transform:translateX(0)}to{transform:translateX(-50%)}}

@media (max-width:900px){
  main{grid-template-columns:1fr;grid-template-rows:46vh 1fr;height:calc(100% - 128px)}
  .feed{border-left:0;border-top:1px solid var(--rule)}
  header{padding:10px 14px;gap:10px}
  .masthead{font-size:18px}.sub{display:none}
  .controls,.legend{font-size:9px;bottom:8px}
  .controls input[type=range]{width:62px}
  .chip .rg{font-size:16px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<header>
  <div>
    <div class="masthead">N콘텐츠본부 속보 <em>상황판</em></div>
    <div class="sub">KOREA REGIONAL SITUATION BOARD · REALTIME</div>
  </div>
  <span class="live" id="live" data-mode="loading"><span class="pip"></span><span id="liveTxt">접속 중</span></span>
  <div class="spacer"></div>
  <div class="stat">수집 <b id="sTotal">0</b>건 · 활성 지역 <b id="sRegions">0</b>곳</div>
  <div class="stat">갱신 <b id="sTime">--:--</b> · 다음 <b id="sNext">--:--</b></div>
  <button class="btn" id="refresh">지금 새로 가져오기</button>
  <button class="btn" id="share">공유하기 ↗</button>
</header>

  <section class="stage" id="stage">
    <div class="ambient" id="ambient"></div>
    <div class="scene">

function cityOf(it){
  const dict=CITY[it.region]||{};
  let best=null,len=0;
  const text=it.headline+" "+(it.summary||"");
  Object.keys(dict).forEach(n=>{
    if(n.length>len && text.indexOf(n)>=0){best=n;len=n.length;}
  });
  return best;
}

const nodesEl=document.getElementById("nodes");
const state={items:[],focus:null,mode:"loading",nextAt:0};

function render(){
  /* 기사들을 발광점(도시 우선, 없으면 도 중심)으로 묶는다 */
  const groups={}, byR={};
  state.items.forEach(it=>{
    (byR[it.region]=byR[it.region]||[]).push(it);
    if(it.region==="전국") return;
    const city=cityOf(it);
    const key=city?it.region+"·"+city:it.region;
    if(!groups[key]){
      const p=city?CITY[it.region][city]:REGIONS[it.region].p;
      groups[key]={name:city||it.region,region:it.region,x:p[0],y:p[1],items:[],lift:city?0:REGIONS[it.region].lift};
    }
    groups[key].items.push(it);
  });

  /* 가까운 발광점끼리 라벨이 겹치지 않게 뒤쪽 것을 층으로 띄운다 */
  const gs=Object.values(groups).sort((a,b)=>a.y-b.y||a.x-b.x);
  gs.forEach((g,i)=>{
    for(let j=0;j<i;j++){
      const o=gs[j];
      if(Math.abs(g.x-o.x)<5.5 && Math.abs(g.y-o.y)<5.5 && (o.lift-g.lift)<26) g.lift=o.lift+34;
    }
  });

  /* 노드 재구성: 활성 발광점 + 조용한 시·도 기본 라벨 */
  nodesEl.innerHTML="";
  const activeRegionAtBase={};
  gs.forEach(g=>{ if(g.name===g.region) activeRegionAtBase[g.region]=1; });

  Object.entries(REGIONS).forEach(([name,r])=>{
    if(activeRegionAtBase[name]) return;
    const n=document.createElement("div");
    n.className="node base"+(state.focus&&state.focus.region!==name?" dim":"");
    n.style.left=r.p[0]+"%"; n.style.top=r.p[1]+"%";
    n.innerHTML=`<div class="dot"></div>
      <div class="beam" style="height:0"><div class="chip"><span class="rg">${name}</span></div></div>
      <button class="hit" aria-label="${name} 보기"></button>`;
    n.querySelector(".hit").addEventListener("click",()=>focusOn(
      state.focus&&state.focus.region===name?null:{region:name,x:r.p[0],y:r.p[1]}));
    nodesEl.appendChild(n);
  });

  gs.forEach(g=>{
    const top=Math.max(...g.items.map(a=>a.urgency));
    const n=document.createElement("div");
    n.className="node hot"
      +(state.focus&&state.focus.region!==g.region?" dim":"")
      +(state.focus&&state.focus.region===g.region?" sel":"");
    n.style.left=g.x+"%"; n.style.top=g.y+"%";
    n.style.setProperty("--c",URG[top].c);
    const hgt=g.lift+44+Math.min(g.items.length*28,84);
    n.innerHTML=`<div class="pool"></div><div class="ring"></div><div class="dot"></div>
      <div class="beam" style="height:${hgt}px"><div class="chip">
        <span class="rg">${g.name}</span><span class="ct">${g.items.length}</span></div></div>
      <button class="hit" aria-label="${g.name} 속보 ${g.items.length}건 보기"></button>`;
    n.querySelector(".hit").addEventListener("click",()=>focusOn(
      state.focus&&state.focus.region===g.region&&state.focus.x===g.x?null:{region:g.region,x:g.x,y:g.y}));
    nodesEl.appendChild(n);
  });

  /* 피드 */
  const view=state.focus?state.items.filter(i=>i.region===state.focus.region):state.items;
  document.getElementById("feedTitle").textContent=state.focus?state.focus.region+" 속보":"전체 지역";
  document.getElementById("sTotal").textContent=state.items.length;
  document.getElementById("sRegions").textContent=Object.keys(byR).length;
  const hn=document.getElementById("hudN"); if(hn) hn.textContent=String(gs.length).padStart(2,"0");
  document.getElementById("reset").classList.toggle("on",!!state.focus);

  const list=document.getElementById("list");
  if(!view.length){
    list.innerHTML=`<div class="empty"><b>${state.mode==="loading"?"뉴스를 가져오는 중":"표시할 속보 없음"}</b>${
      state.mode==="loading"?"각 지역 소식을 모으고 있습니다.":"상단의 ‘지금 새로 가져오기’를 누르면 다시 수집합니다."}</div>`;
  }else{
    const brk=view.filter(i=>i.breaking), gen=view.filter(i=>!i.breaking);
    const card=it=>{
      const u=URG[it.urgency]||URG[1];
      const tag=it.link?`a href="${esc(it.link)}" target="_blank" rel="noopener"`:`div role="button" tabindex="0"`;
      const close=it.link?"a":"div";
      const pin=it.region!=="전국"?`<span class="pin" data-id="${it.id}" title="지도에서 보기">◎ 지도</span>`:"";
      const badge=it.breaking?`<span class="badge brk">속보</span>`:`<span class="badge">${u.k}</span>`;
      return `<${tag} class="card${it.breaking?" isbrk":""}${it.fresh?" fresh":""}" style="--c:${u.c}" data-id="${it.id}">
        <div class="meta">${badge}<span class="rgname">${esc(it.region)}</span><span class="time">${esc(it.time||"")}</span></div>
        <p class="hl">${esc(it.headline)}</p><p class="sm">${esc(it.summary||"")}</p>
        <div class="foot"><span class="src">${esc(it.source||"출처 미상")}</span>${pin}</div></${close}>`;
    };
    list.innerHTML=
      `<div class="sechead brkhead">속보 <b>${brk.length}</b></div>`+
      (brk.length?brk.map(card).join(""):`<div class="secempty">현재 표식 속보 없음 · 들어오는 즉시 표시</div>`)+
      (gen.length?`<div class="sechead">지역 뉴스 <b>${gen.length}</b></div>`+gen.map(card).join(""):"");
    /* 카드 클릭 = 기사 원문. ◎ 지도 버튼 = 해당 위치로 포커스 */
    list.querySelectorAll(".pin").forEach(b=>b.addEventListener("click",ev=>{
      ev.preventDefault(); ev.stopPropagation();
      const it=state.items.find(i=>i.id===b.dataset.id); if(!it) return;
      const city=cityOf(it);
      const p=city?CITY[it.region][city]:REGIONS[it.region].p;
      focusOn({region:it.region,x:p[0],y:p[1]});
    }));
  }

  const tick=state.items.filter(i=>i.breaking).concat(state.items.filter(i=>!i.breaking)).slice(0,14);
  const t=tick.map(i=>`<span><b>${esc(i.region)}</b>${esc(i.headline)}</span>`).join("");
  document.getElementById("ticker").innerHTML=t?t+t:"";

  const sel=document.getElementById("filter");
  if(!sel.options.length){
    sel.innerHTML=`<option value="">전체</option><option value="전국">전국(통신)</option>`
      +Object.keys(REGIONS).map(r=>`<option value="${r}">${r}</option>`).join("");
    sel.addEventListener("change",e=>{
      const r=e.target.value;
      if(!r){focusOn(null);return;}
      if(r==="전국"){state.focus={region:"전국"};plane.style.setProperty("--zoom","1");render();return;}
      focusOn({region:r,x:REGIONS[r].p[0],y:REGIONS[r].p[1]});
    });
  }
  sel.value=state.focus?state.focus.region:"";
}

const plane=document.getElementById("plane");
function focusOn(f){
  state.focus=f;
  const ret=document.getElementById("reticle");
  if(f){
    plane.style.setProperty("--ox",f.x+"%");
    plane.style.setProperty("--oy",f.y+"%");
    plane.style.setProperty("--zoom","1.85");
    ret.style.left=f.x+"%"; ret.style.top=f.y+"%";
    document.getElementById("reticleTxt").textContent="TRACK · "+f.region;
    ret.classList.remove("on"); void ret.offsetWidth; ret.classList.add("on");
  }else{
    plane.style.setProperty("--ox","50%"); plane.style.setProperty("--oy","50%");
    plane.style.setProperty("--zoom","1");
    ret.classList.remove("on");
  }
  render();
}
document.getElementById("reset").addEventListener("click",()=>focusOn(null));
function esc(s){return String(s??"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[m]))}

/* 컨트롤 */
const root=document.documentElement;
document.getElementById("tilt").addEventListener("input",e=>{root.style.setProperty("--tilt",e.target.value+"deg");fit();});
document.getElementById("dim").addEventListener("input",e=>root.style.setProperty("--dim",(e.target.value/100).toFixed(2)));

function fit(){
  const st=document.getElementById("stage");
  const rad=parseFloat(getComputedStyle(root).getPropertyValue("--tilt"))*Math.PI/180;
  const s=Math.min((st.clientWidth-40)/828,(st.clientHeight-64)/(676*Math.cos(rad)+40));
  plane.style.setProperty("--fit",Math.max(.2,Math.min(s,2.6)).toFixed(3));
}
window.addEventListener("resize",fit);

/* ── 수집 ─────────────────────────────── */
function setMode(m,t){state.mode=m;const el=document.getElementById("live");el.dataset.mode=m;document.getElementById("liveTxt").textContent=t}
const hm=d=>String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");

async function fetchNews(){
  const firstLoad = state.items.length===0 || state.mode==="sample";
  setMode("loading","수집 중"); render();
  try{
    if(CONFIG.ENDPOINT){
      /* 선발대: 통신사 속보만 — 피드 서너 개라 수 초 안에 온다 */
      const wire=fromBackend("wire").then(items=>{
        if(items.length && state.mode==="loading"){
          mergeItems(items,!firstLoad);
          setMode("live","LIVE · 수신중"); render();
        }
      }).catch(()=>{});
      /* 본대: 전체 피드 */
      const items=await fromBackend("");
      await wire.catch(()=>{});
      if(!items.length && !state.items.length) throw new Error("결과 없음");
      mergeItems(items,!firstLoad);
      setMode("live","LIVE · 속보망");
    }else{
      const items=await fromClaude();
      if(!items.length) throw new Error("결과 없음");
      mergeItems(items,false);
      setMode("live","LIVE · 검색");
    }
  }catch(err){
    console.warn("수집 실패:",err);
    if(!state.items.length){
      state.items=SAMPLE.map((o,i)=>({...o,id:"s"+i,ts:Date.now()-i*60000}));
      setMode("sample","샘플 데이터");
    }else{
      setMode("live","LIVE · 속보망");   // 이미 받은 것으로 유지
    }
  }
  document.getElementById("sTime").textContent=hm(new Date());
  state.nextAt=Date.now()+CONFIG.REFRESH;
  render();
}

async function fromBackend(part){
  const q=(CONFIG.ENDPOINT.indexOf("?")<0?"?":"&")+(part?"part="+part+"&":"")+"t="+Date.now();
  const res=await fetch(CONFIG.ENDPOINT+q,{method:"GET"});
  if(!res.ok) throw new Error("HTTP "+res.status);
  const data=await res.json();
  if(!data.ok) throw new Error(data.error||"백엔드 오류");
  return normalize(data.items||[]);
}

async function fromClaude(){
  const now=new Date();
  const prompt=`오늘은 ${now.getFullYear()}년 ${now.getMonth()+1}월 ${now.getDate()}일(한국시간)이다. 웹 검색으로 대한민국 각 시·도의 최근 24시간 주요 뉴스와 속보를 찾아라.

규칙
- 통신사·언론사가 '[속보]' 표식을 붙인 기사를 최우선으로 찾아라.
- 서로 다른 지역 9~12건. 수도권 편중 금지, 비수도권을 최소 6건 포함할 것.
- region 값은 반드시 이 중 하나: 서울 부산 대구 인천 광주 대전 울산 세종 경기 강원 충북 충남 전북 전남 경북 경남 제주
- headline 35자 이내, summary 55자 이내. 모두 한국어 평서형.
- urgency: 3=사건사고·재난·긴급 속보, 2=지역 주요 현안·정책, 1=일반 소식
- time은 보도 시각 HH:MM, 모르면 빈 문자열. source는 매체명만.

출력은 아래 형식의 JSON 배열만. 설명·머리말·코드펜스 금지.
[{"region":"대구","headline":"...","summary":"...","urgency":2,"source":"매일신문","time":"09:30"}]`;
  const res=await fetch("https://api.anthropic.com/v1/messages",{
    method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({model:CONFIG.MODEL,max_tokens:1000,messages:[{role:"user",content:prompt}],
      tools:[{type:"web_search_20250305",name:"web_search"}]})});
  if(!res.ok) throw new Error("HTTP "+res.status);
  const data=await res.json();
  const text=(data.content||[]).filter(b=>b.type==="text").map(b=>b.text).join("\n");
  const s=text.indexOf("["), e=text.lastIndexOf("]");
  if(s<0||e<0) throw new Error("형식 오류");
  return normalize(JSON.parse(text.slice(s,e+1)));
}

function normalize(arr){
  return arr.filter(o=>o&&(REGIONS[o.region]||o.region==="전국")&&o.headline)
    .map((o,i)=>({id:"n"+Date.now()+"_"+i,region:o.region,headline:String(o.headline),
      summary:String(o.summary||""),urgency:[1,2,3].includes(+o.urgency)?+o.urgency:1,
      source:String(o.source||""),time:String(o.time||""),link:o.link||"",
      breaking:o.breaking?1:0,ts:+o.ts||Date.now()}))
    .sort((a,b)=>(b.ts-a.ts)||(b.breaking-a.breaking));
}

/* 점진 수신: 새로 온 기사를 기존 목록에 합치고 최신순으로 다시 세운다.
   같은 기사(제목 앞 18자 기준)는 한 번만 남는다. 처음 이후에 새로 들어온
   기사에는 fresh 표식이 붙어 카드가 한 번 빛난다. */
const keyOf=h=>String(h).replace(/[^가-힣a-zA-Z0-9]/g,"").slice(0,18);
function mergeItems(arr,markFresh){
  const map={};
  state.items.forEach(i=>{i.fresh=0;map[keyOf(i.headline)]=i;});
  arr.forEach(i=>{
    const k=keyOf(i.headline); if(!k) return;
    if(!map[k]){ i.fresh=markFresh?1:0; map[k]=i; }
    else if(i.ts>map[k].ts){ i.fresh=0; map[k]=i; }
  });
  state.items=Object.values(map)
    .sort((a,b)=>(b.ts-a.ts)||(b.breaking-a.breaking))
    .slice(0,80);
}

setInterval(()=>{
  if(!state.nextAt) return;
  const left=Math.max(0,state.nextAt-Date.now());
  document.getElementById("sNext").textContent=
    String(Math.floor(left/60000)).padStart(2,"0")+":"+String(Math.floor(left/1000)%60).padStart(2,"0");
  if(left===0){state.nextAt=0;fetchNews()}
},1000);

/* 실시간 수집 실패 시에만 표시되는 예시 데이터 */
const SAMPLE=[
 {region:"대구",headline:"도심 지하상가 전기설비 화재… 상인 대피",summary:"인명피해 없이 20분 만에 진화, 영업 일시 중단.",urgency:3,source:"샘플",time:"11:12"},
 {region:"경북",headline:"동해안 너울성 파도 주의보 발효",summary:"포항·영덕 해안도로 일부 통제, 해수욕장 입수 금지.",urgency:3,source:"샘플",time:"10:40"},
 {region:"서울",headline:"지하철 2호선 신호 장애로 지연 운행",summary:"출근길 20분 지연 후 복구, 혼잡 한때 극심.",urgency:3,source:"샘플",time:"08:21"},
 {region:"부산",headline:"북항 재개발 2단계 사업자 공모 착수",summary:"내달 접수 마감, 연내 우선협상대상자 선정 계획.",urgency:2,source:"샘플",time:"09:55"},
 {region:"경기",headline:"반도체 클러스터 용수 공급 협약 체결",summary:"2030년까지 하루 30만t 공급 기반 마련.",urgency:2,source:"샘플",time:"10:05"},
 {region:"강원",headline:"설악산 일대 집중호우 예비특보",summary:"시간당 30㎜ 예상, 계곡 출입 자제 당부.",urgency:2,source:"샘플",time:"11:30"},
 {region:"광주",headline:"복합쇼핑몰 건축심의 통과",summary:"착공 시점 내년 상반기로 조정 전망.",urgency:2,source:"샘플",time:"11:02"},
 {region:"전남",headline:"여수산단 정기보수 돌입… 물류 조정",summary:"3주간 진행, 인근 도로 대형차량 통행 증가.",urgency:1,source:"샘플",time:"09:10"},
 {region:"충남",headline:"천안 신설 노선버스 12개 노선 확대",summary:"내달 1일부터 배차 간격 평균 8분 단축.",urgency:1,source:"샘플",time:"08:47"},
 {region:"제주",headline:"입도 관광객 상반기 700만명 회복",summary:"국제선 증편 효과, 숙박 가동률 동반 상승.",urgency:1,source:"샘플",time:"10:22"}
];

document.getElementById("refresh").addEventListener("click",fetchNews);

/* 공유: 모바일은 시스템 공유판, 데스크톱은 링크 복사 */
document.getElementById("share").addEventListener("click",async()=>{
  const b=document.getElementById("share");
  const url=location.href.split("#")[0];
  try{
    if(navigator.share){
      await navigator.share({title:"N콘텐츠본부 속보 상황판",
        text:"대한민국 실시간 지역 속보 상황판",url});
      return;
    }
    await navigator.clipboard.writeText(url);
    b.textContent="링크 복사됨 ✓";
  }catch(e){
    if(e && e.name==="AbortError") return;          // 공유판 취소는 정상
    try{ await navigator.clipboard.writeText(url); b.textContent="링크 복사됨 ✓"; }
    catch(_){ window.prompt("주소를 복사하세요", url); return; }
  }
  setTimeout(()=>{ b.textContent="공유하기 ↗"; },2200);
});

/* ── HUD: 판 위 십자선 + 실좌표 판독 ──
   capture 레이어는 판과 같은 좌표계라 offsetX/Y 가 곧 판 위 위치다.
   x% = 10.491·lon − 1297.43 의 역산으로 실제 경위도를 띄운다. */
(function(){
  const cap=document.getElementById("capture"), cr=document.getElementById("cross");
  const cx=cr.querySelector(".cx"), cy=cr.querySelector(".cy"), txt=document.getElementById("crossTxt");
  cap.addEventListener("pointermove",e=>{
    const X=e.offsetX, Y=e.offsetY, W=cap.clientWidth, H=cap.clientHeight;
    cx.style.left=X+"px"; cy.style.top=Y+"px";
    txt.style.left=X+"px"; txt.style.top=Y+"px";
    const lon=(X/W*100+1631.79)/13.1138, lat=(755.08-Y/H*100)/19.8373;
    txt.textContent=lat.toFixed(3)+"°N "+lon.toFixed(3)+"°E";
  });
})();

/* 시계·세션 */
document.getElementById("hudS").textContent=
  Array.from(crypto.getRandomValues(new Uint8Array(2))).map(b=>b.toString(16).padStart(2,"0")).join("").toUpperCase();
setInterval(()=>{
  const f=(d,tz)=>d.toLocaleTimeString("en-GB",{hour12:false,timeZone:tz});
  const now=new Date();
  document.getElementById("hudK").textContent=f(now,"Asia/Seoul");
  document.getElementById("hudU").textContent=f(now,"UTC");
  const b=document.getElementById("hudB"), n=3+Math.floor(Math.random()*3);
  b.textContent="▮".repeat(n)+"▯".repeat(5-n);
},1000);

fit(); render(); fetchNews();
</script>
